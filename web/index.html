<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Orchard</title>
        <link rel="icon" href="icon.png" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="window" id="window">
            <aside class="sidebar">
                <div class="sidebar-toolbar">
                    <img src="icon.png" alt="" class="app-icon" />
                    <span class="spacer"></span>
                    <button class="tool" id="toggle-sidebar" title="Hide Sidebar" data-icon="panel"></button>
                    <button class="tool" id="new-chat" title="New Chat" data-icon="compose"></button>
                </div>
                <nav class="source-list">
                    <h3>Chats</h3>
                    <ul id="chat-list"></ul>
                    <h3>Tasks</h3>
                    <ul id="task-list"></ul>
                </nav>
                <div class="sidebar-footer">
                    <span id="status" class="status" title="Checking fm serve…"><i></i><span>fm serve</span></span>
                </div>
            </aside>

            <main class="content">
                <header class="toolbar">
                    <button class="tool" id="show-sidebar" title="Show Sidebar" data-icon="panel" hidden></button>
                    <h1 id="title">Orchard</h1>
                    <span class="spacer"></span>
                    <div class="popover-anchor">
                        <button class="tool" id="sys-btn" title="System Prompt" data-icon="sliders"></button>
                        <div class="popover" id="sys-pop" hidden>
                            <h4>System Prompt</h4>
                            <textarea id="sys-prompt" rows="5"></textarea>
                            <div class="row">
                                <button class="btn" id="sys-reset">Reset</button>
                                <span class="spacer"></span>
                                <button class="btn" id="sys-cancel">Cancel</button>
                                <button class="btn primary" id="sys-save">Save</button>
                            </div>
                        </div>
                    </div>
                </header>

                <div class="banner" id="banner" hidden>
                    <span data-icon="alert"></span>
                    <span id="banner-text"></span>
                </div>

                <!-- Chat -->
                <section id="chat" class="view">
                    <div id="messages"></div>
                    <form id="composer">
                        <div class="composer-row">
                            <textarea id="input" rows="1" placeholder="Message"></textarea>
                            <button type="button" class="round stop" id="stop" title="Stop" hidden data-icon="stop"></button>
                            <button type="submit" class="round send" id="send" title="Send (Return)" data-icon="arrow"></button>
                        </div>
                        <div class="meter-row">
                            <span id="meter" class="meter" title="Estimated tokens in the next request (chars ÷ 4)">
                                <span class="bar"><b></b></span><span class="meter-text">0 / 3,000 tokens</span>
                            </span>
                            <span id="trim-note"></span>
                        </div>
                    </form>
                </section>

                <!-- Tasks -->
                <section id="tasks" class="view" hidden>
                    <div class="task-scroll">
                        <div class="task-body">
                            <p class="task-desc" id="task-desc"></p>
                            <div class="group">
                                <label class="group-row" id="opt-wrap" hidden>
                                    <span id="opt-label"></span>
                                    <span id="opt-field"></span>
                                </label>
                                <textarea id="task-input" rows="10" placeholder="Paste text…"></textarea>
                            </div>
                            <div class="row">
                                <span id="task-count" class="caption"></span>
                                <span class="spacer"></span>
                                <button class="btn primary" id="task-run" title="Run (⌘Return)">Run</button>
                            </div>
                            <p id="task-warn" class="warn" hidden></p>
                            <div id="task-out-wrap" class="group output" hidden>
                                <div class="row output-head">
                                    <span class="badge">Draft</span>
                                    <span id="task-note" class="caption"></span>
                                    <span class="spacer"></span>
                                    <button class="tool small" id="task-copy" title="Copy" data-icon="copy"></button>
                                </div>
                                <pre id="task-out"></pre>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <script src="app.js"></script>
    </body>
</html>
